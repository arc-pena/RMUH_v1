<title>Viewport Zero</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
/* Viewport Zero — a DCC viewport, committed to one dark world rather than
   answering the host theme. Every colour is painted explicitly so the page
   holds on either ground. */
:root {
  --ground: #0a0e14;
  --panel: rgba(14, 19, 27, 0.74);
  --raise: rgba(14, 19, 27, 0.86);
  --edge: rgba(140, 168, 200, 0.15);
  --edge-soft: rgba(140, 168, 200, 0.07);
  --ink: #e2e9f2;
  --dim: #8895a8;
  --faint: #5a6675;
  --accent: #5be9c0;
  --accent-deep: #2fbf9a;
  --warn: #f0b849;
  --bad: #ff7a70;

  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font: 400 13px/1.5 var(--mono);
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* ------------------------------------------------------------ instrument panel */

#hud {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 20;
  width: 296px;
  max-width: calc(100vw - 32px);
  padding: 11px 13px 10px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  font-size: 11px;
  letter-spacing: 0.015em;
  pointer-events: none;
  user-select: none;
}

.hud-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 9px;
}

#hud-title {
  flex: 1;
  min-width: 0;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#hud-timer {
  flex: none;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.state {
  flex: none;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  background: rgba(140, 168, 200, 0.09);
  color: var(--faint);
}
.state.thinking,
.state.writing,
.state.building { color: #061410; background: var(--accent); }
.state.ready { color: var(--accent); background: rgba(91, 233, 192, 0.13); }
.state.error { color: #1a0705; background: var(--bad); }

.state.thinking,
.state.writing,
.state.building { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.42; } }

/* The readout: label left, figure right, hairline under each pair. */
#hud-stats {
  margin: 0 0 9px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 3px 16px;
}
#hud-stats > div {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding-bottom: 2px;
  border-bottom: 1px solid var(--edge-soft);
}
#hud-stats dt { color: var(--faint); }
#hud-stats dd {
  margin: 0;
  color: var(--ink);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

#hud-progress {
  height: 2px;
  margin-bottom: 9px;
  background: rgba(140, 168, 200, 0.1);
  overflow: hidden;
}
#hud-bar {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.14s linear;
}

#hud-log {
  margin: 0;
  padding: 0;
  list-style: none;
  max-height: 32vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#hud-log li {
  color: var(--dim);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  animation: slip 0.22s ease-out;
}
#hud-log li::before { content: "› "; color: var(--faint); }
#hud-log li.ahead { color: var(--faint); }
#hud-log li.ahead::before { content: "· "; }
#hud-log li.warn { color: var(--warn); }
#hud-log li.bad { color: var(--bad); }
#hud-log li.good { color: var(--accent); }
@keyframes slip { from { opacity: 0; transform: translateY(-3px); } }

/* ---------------------------------------------------------------- code ticker */

#codestream {
  position: fixed;
  right: 16px;
  bottom: 96px;
  z-index: 15;
  margin: 0;
  width: 330px;
  max-width: calc(100vw - 32px);
  height: 168px;
  padding: 9px 11px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--faint);
  font-size: 10px;
  line-height: 1.45;
  overflow: hidden;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  pointer-events: none;
  user-select: none;
  mask-image: linear-gradient(to bottom, transparent, #000 36px);
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 36px);
}
#codestream code { color: inherit; font: inherit; }

/* ------------------------------------------------------------------ prompt bar */

#bar {
  position: fixed;
  left: 50%;
  bottom: 36px;
  z-index: 30;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  width: min(600px, calc(100vw - 32px));
  padding: 6px 6px 6px 16px;
  border: 1px solid rgba(140, 168, 200, 0.2);
  border-radius: 6px;
  background: var(--raise);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
  transition: border-color 0.18s, box-shadow 0.18s;
}
#bar:focus-within {
  border-color: rgba(91, 233, 192, 0.45);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(91, 233, 192, 0.1);
}
body.busy #bar { border-color: rgba(91, 233, 192, 0.3); }

#prompt {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: none;
  color: var(--ink);
  font: 400 14.5px/1.4 var(--sans);
}
#prompt::placeholder { color: var(--faint); }
#prompt:disabled { opacity: 0.42; }

#go, #stop {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity 0.18s, transform 0.12s;
}
#go { background: var(--accent); color: #061410; }
#go:hover:not(:disabled) { transform: translateX(1px); }
#go:disabled { opacity: 0.28; cursor: default; }
#stop {
  background: rgba(140, 168, 200, 0.12);
  color: var(--dim);
  font: 500 10px/1 var(--mono);
  letter-spacing: 0.06em;
}
#stop:hover { color: var(--ink); background: rgba(140, 168, 200, 0.2); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#hint {
  position: fixed;
  left: 50%;
  bottom: 15px;
  z-index: 30;
  transform: translateX(-50%);
  margin: 0;
  width: min(600px, calc(100vw - 32px));
  text-align: center;
  color: var(--faint);
  font-size: 10.5px;
  letter-spacing: 0.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  transition: opacity 0.3s;
}
body.busy #hint { opacity: 0; }

/* ------------------------------------------------------- generated overlays */

#overlays {
  position: fixed;
  inset: 0;
  z-index: 18;
  pointer-events: none;
}
#overlays > * {
  position: absolute;
  top: 16px;
  right: 16px;
  max-width: min(310px, calc(100vw - 32px));
  padding: 9px 12px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--dim);
  font: 400 11px/1.55 var(--mono);
  animation: rise 0.28s ease-out;
}
#overlays b, #overlays strong { color: var(--ink); font-weight: 500; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

@media (max-width: 760px) {
  #codestream { display: none; }
  #hud { width: 224px; font-size: 10px; padding: 9px 10px 8px; }
  #hud-stats { grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  #hud-log { max-height: 20vh; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

<canvas id="stage"></canvas>

<div id="overlays" aria-live="off"></div>

<section id="hud" aria-label="engine readout">
  <header class="hud-head">
    <span id="hud-state" class="state idle">idle</span>
    <span id="hud-title">opening scene</span>
    <span id="hud-timer" hidden></span>
  </header>

  <dl id="hud-stats">
    <div><dt>objects</dt><dd id="s-objects">0</dd></div>
    <div><dt>vertices</dt><dd id="s-verts">0</dd></div>
    <div><dt>tris</dt><dd id="s-tris">0</dd></div>
    <div><dt>draws</dt><dd id="s-draws">0</dd></div>
    <div><dt>geo/tex</dt><dd id="s-mem">0 / 0</dd></div>
    <div><dt>fps</dt><dd id="s-fps">—</dd></div>
  </dl>

  <div id="hud-progress" hidden><span id="hud-bar"></span></div>
  <ul id="hud-log"></ul>
</section>

<pre id="codestream" hidden><code id="codestream-body"></code></pre>

<form id="bar" autocomplete="off">
  <input id="prompt" type="text" placeholder="describe a world…"
         spellcheck="false" autocapitalize="off" enterkeyhint="go"
         aria-label="describe a world">
  <button id="stop" type="button" hidden aria-label="stop this build">esc</button>
  <button id="go" type="submit" aria-label="build it">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M5 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</form>

<p id="hint">drag to orbit · shift+enter for an idea · every prompt continues the last</p>

<script>/*BUNDLE*/</script>
